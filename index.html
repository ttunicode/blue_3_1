<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>호우 대응 부처별 보도자료 정리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f3f6fb;
    --surface: #ffffff;
    --surface-2: #f7f9fc;
    --text: #172033;
    --muted: #5d6779;
    --border: #e1e6ef;
    --accent: #1d5fd1;
    --accent-soft: #e6eefc;
    --mark: #ffe17a;
    --hero-1: #0b2a5b;
    --hero-2: #1d5fd1;
    --shadow: 0 1px 2px rgba(16, 32, 64, .06), 0 6px 20px rgba(16, 32, 64, .06);
    --shadow-hover: 0 2px 4px rgba(16, 32, 64, .08), 0 14px 32px rgba(16, 32, 64, .12);
    --c-mois: #1d5fd1;
    --c-kma: #0b8f6c;
    --c-police: #4a4fc4;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f141c;
      --surface: #171e29;
      --surface-2: #1d2532;
      --text: #e7ebf2;
      --muted: #9ca6b7;
      --border: #2a3343;
      --accent: #6ea4ff;
      --accent-soft: #1f2d47;
      --mark: #7a6514;
      --hero-1: #0a1a36;
      --hero-2: #173e86;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 20px rgba(0, 0, 0, .25);
      --shadow-hover: 0 2px 4px rgba(0, 0, 0, .35), 0 14px 32px rgba(0, 0, 0, .4);
      --c-mois: #5b93f0;
      --c-kma: #2fbf95;
      --c-police: #8a8ff0;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }

  /* ── Hero ── */
  .hero {
    background: linear-gradient(135deg, var(--hero-1) 0%, var(--hero-2) 100%);
    color: #fff;
    padding: 48px 0 88px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: ""; position: absolute; inset: 0;
    background-image: repeating-linear-gradient(105deg, rgba(255,255,255,.07) 0 2px, transparent 2px 22px);
    pointer-events: none;
  }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: .82rem; font-weight: 500; letter-spacing: .02em;
    background: rgba(255,255,255,.14); padding: 4px 12px; border-radius: 999px;
  }
  .hero h1 { margin: 14px 0 8px; font-size: clamp(1.6rem, 4vw, 2.3rem); font-weight: 800; letter-spacing: -.02em; }
  .hero p { margin: 0; opacity: .85; max-width: 560px; }

  /* ── 통계 ── */
  .stats {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
    margin-top: -56px; position: relative; z-index: 1;
  }
  .stat {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 18px; box-shadow: var(--shadow);
  }
  .stat .num { font-size: 1.6rem; font-weight: 800; line-height: 1.2; }
  .stat .label { font-size: .85rem; color: var(--muted); }

  /* ── 검색 패널 ── */
  .panel {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; margin-top: 16px; box-shadow: var(--shadow);
  }
  .search-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .search-box { position: relative; flex: 1; min-width: 200px; }
  .search-box svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); }
  .search-row select, .search-box input {
    font: inherit; color: var(--text);
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    width: 100%;
  }
  .search-row select { width: auto; }
  .search-box input { padding-left: 38px; }
  .search-row select:focus, .search-box input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .chip {
    font: inherit; font-size: .88rem; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--muted); padding: 5px 14px; border-radius: 999px;
    display: inline-flex; align-items: center; gap: 6px;
    transition: background .15s, color .15s, border-color .15s;
  }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--accent)); }
  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--text); font-weight: 500; }

  .count { color: var(--muted); margin: 20px 0 12px; font-size: .95rem; }
  .count strong { color: var(--accent); font-size: 1.1rem; }

  /* ── 카드 ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 16px;
  }
  .card {
    --c: var(--accent);
    background: var(--surface);
    border: 1px solid var(--border);
    border-top: 4px solid var(--c);
    border-radius: 14px;
    padding: 20px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow);
    transition: transform .18s, box-shadow .18s;
  }
  .card:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .tag {
    color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent);
    font-size: .8rem; font-weight: 700;
    padding: 3px 10px; border-radius: 999px;
  }
  .no { font-size: .78rem; color: var(--muted); }
  .card h2 { margin: 0; font-size: 1.08rem; line-height: 1.45; letter-spacing: -.01em; }
  .summary { margin: 0; color: var(--muted); font-size: .93rem; }
  details summary {
    cursor: pointer; color: var(--accent); font-size: .9rem; font-weight: 500;
    list-style: none; display: inline-flex; align-items: center; gap: 4px;
  }
  details summary::-webkit-details-marker { display: none; }
  details summary::before { content: "▸"; transition: transform .15s; }
  details[open] summary::before { transform: rotate(90deg); }
  details .full {
    white-space: pre-line; font-size: .92rem; margin-top: 8px;
    background: var(--surface-2); border-radius: 10px; padding: 12px 14px;
  }
  .contact {
    margin: auto 0 0; padding-top: 12px; border-top: 1px dashed var(--border);
    font-size: .84rem; color: var(--muted);
  }
  mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 2px; }
  .empty, .error {
    grid-column: 1 / -1; text-align: center; color: var(--muted);
    padding: 48px 16px; border: 1px dashed var(--border); border-radius: 14px;
    background: var(--surface);
  }

  /* ── 영상 ── */
  section.videos { margin-top: 56px; }
  .section-title { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; }
  .section-title h2 { margin: 0; font-size: 1.25rem; letter-spacing: -.01em; }
  .section-desc { margin: 0 0 16px; color: var(--muted); font-size: .93rem; }
  .video-grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  }
  .video {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    overflow: hidden; box-shadow: var(--shadow);
  }
  .player { position: relative; aspect-ratio: 16 / 9; background: #000; }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .video .cap { padding: 12px 16px; font-size: .9rem; color: var(--muted); }

  footer {
    margin: 56px 0 0; padding: 24px 0 40px; border-top: 1px solid var(--border);
    color: var(--muted); font-size: .85rem;
  }

  @media (max-width: 560px) {
    .stats { grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .stat { padding: 12px; }
    .stat .num { font-size: 1.3rem; }
    .stat .label { font-size: .75rem; }
    .search-row select { width: 100%; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <span class="eyebrow">☔ 재난 대응 브리핑</span>
    <h1>호우 대응 부처별 보도자료 정리</h1>
    <p>행정안전부 · 기상청 · 경찰청이 낸 호우 대응 보도자료를 한곳에서 모아 보고, 부처나 키워드로 찾아볼 수 있습니다.</p>
  </div>
</header>

<main class="wrap">
  <div class="stats">
    <div class="stat"><div class="num" id="statDocs">–</div><div class="label">보도자료</div></div>
    <div class="stat"><div class="num" id="statDepts">–</div><div class="label">참여 부처</div></div>
    <div class="stat"><div class="num" id="statVideos">2</div><div class="label">관련 영상</div></div>
  </div>

  <div class="panel" role="search">
    <div class="search-row">
      <select id="field" aria-label="검색 대상">
        <option value="all">전체</option>
        <option value="dept">부처</option>
        <option value="body">본문</option>
      </select>
      <div class="search-box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="키워드 입력 (예: 경찰청, 1,820명, 중대본)" aria-label="검색어">
      </div>
    </div>
    <div class="chips" id="chips" aria-label="부처 필터"></div>
  </div>

  <p class="count" id="count" aria-live="polite">불러오는 중…</p>
  <div class="grid" id="grid"></div>

  <section class="videos">
    <div class="section-title"><h2>관련 영상</h2></div>
    <p class="section-desc">호우·태풍 대비 국민행동요령을 영상으로 확인하세요.</p>
    <div class="video-grid">
      <figure class="video" style="margin:0">
        <div class="player">
          <iframe src="https://www.youtube-nocookie.com/embed/uHI5xJaql0I" title="호우 관련 영상 1" loading="lazy"
            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <figcaption class="cap">행정안전부 · 태풍·호우 대비 국민행동요령</figcaption>
      </figure>
      <figure class="video" style="margin:0">
        <div class="player">
          <iframe src="https://www.youtube-nocookie.com/embed/oMOrqymOuTQ" title="호우 관련 영상 2" loading="lazy"
            allow="accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        </div>
        <figcaption class="cap">기상청 · 집중호우! 이렇게 대비하세요</figcaption>
      </figure>
    </div>
  </section>

  <footer>데이터 출처: 보도자료데이터.json (행정안전부 · 기상청 · 경찰청 보도자료)</footer>
</main>

<script>
  const DATA_URL = encodeURI("보도자료데이터.json");
  const COLORS = { "행정안전부": "var(--c-mois)", "기상청": "var(--c-kma)", "경찰청": "var(--c-police)" };

  const grid = document.getElementById("grid");
  const countEl = document.getElementById("count");
  const qEl = document.getElementById("q");
  const fieldEl = document.getElementById("field");
  const chipsEl = document.getElementById("chips");
  let items = [];
  let activeDept = "";

  // 마크다운 기호 제거 → 평문
  function toPlain(md) {
    return md
      .replace(/^#.*$/m, "")
      .replace(/\*\*(.+?)\*\*/g, "$1")
      .replace(/^-{3,}\s*$/gm, "")
      .replace(/\n{3,}/g, "\n\n")
      .trim();
  }

  function prepare(raw) {
    const plain = toPlain(raw["본문"] || "");
    const deptMatch = plain.match(/담당 부서:\s*(.+)/);
    const bodyOnly = plain.replace(/담당 부서:.*$/m, "").trim();
    const firstPara = bodyOnly.split(/\n\s*\n/)[0] || "";
    return {
      no: raw["번호"],
      dept: raw["부처"],
      title: raw["제목"],
      body: bodyOnly,
      summary: firstPara.length > 110 ? firstPara.slice(0, 110) + "…" : firstPara,
      contact: deptMatch ? deptMatch[1].trim() : ""
    };
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  }
  function highlight(text, q) {
    const safe = escapeHtml(text);
    if (!q) return safe;
    const re = new RegExp(escapeHtml(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
    return safe.replace(re, m => `<mark>${m}</mark>`);
  }

  function matches(item, q, field) {
    if (activeDept && item.dept !== activeDept) return false;
    if (!q) return true;
    const k = q.toLowerCase();
    const inDept = item.dept.toLowerCase().includes(k);
    const inBody = (item.title + "\n" + item.body).toLowerCase().includes(k);
    if (field === "dept") return inDept;
    if (field === "body") return inBody;
    return inDept || inBody;
  }

  function renderChips() {
    const depts = [...new Set(items.map(i => i.dept))];
    const all = [{ name: "", label: "전체 부처", color: "var(--accent)" },
                 ...depts.map(d => ({ name: d, label: d, color: COLORS[d] || "var(--accent)" }))];
    chipsEl.innerHTML = all.map(d =>
      `<button type="button" class="chip" data-dept="${escapeHtml(d.name)}" aria-pressed="${d.name === activeDept}" style="--dot:${d.color}">
         <span class="dot"></span>${escapeHtml(d.label)}</button>`).join("");
  }
  chipsEl.addEventListener("click", e => {
    const btn = e.target.closest(".chip");
    if (!btn) return;
    activeDept = btn.dataset.dept;
    chipsEl.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === btn));
    render();
  });

  function render() {
    const q = qEl.value.trim();
    const field = fieldEl.value;
    const list = items.filter(it => matches(it, q, field));
    const cond = [activeDept, q && `“${escapeHtml(q)}”`].filter(Boolean).join(" · ");
    countEl.innerHTML = `결과 <strong>${list.length}</strong>건` + (cond ? ` <span>· ${cond}</span>` : "");

    if (!list.length) {
      grid.innerHTML = `<div class="empty">🔍 조건에 맞는 보도자료가 없습니다.</div>`;
      return;
    }
    const hlDept = field !== "body" ? q : "";
    const hlBody = field !== "dept" ? q : "";
    const k = q.toLowerCase();
    grid.innerHTML = list.map(it => {
      const openFull = hlBody && it.body.toLowerCase().includes(k) && !it.summary.toLowerCase().includes(k);
      return `
      <article class="card" style="--c:${COLORS[it.dept] || "var(--accent)"}">
        <div class="card-head">
          <span class="tag">${highlight(it.dept, hlDept)}</span>
          <span class="no">보도자료 #${escapeHtml(it.no)}</span>
        </div>
        <h2>${highlight(it.title, hlBody)}</h2>
        <p class="summary">${highlight(it.summary, hlBody)}</p>
        <details ${openFull ? "open" : ""}>
          <summary>본문 전체 보기</summary>
          <div class="full">${highlight(it.body, hlBody)}</div>
        </details>
        ${it.contact ? `<p class="contact">📞 ${escapeHtml(it.contact)}</p>` : ""}
      </article>`;
    }).join("");
  }

  qEl.addEventListener("input", render);
  fieldEl.addEventListener("change", render);

  fetch(DATA_URL)
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(data => {
      items = data.map(prepare);
      document.getElementById("statDocs").textContent = items.length + "건";
      document.getElementById("statDepts").textContent = new Set(items.map(i => i.dept)).size + "곳";
      renderChips();
      render();
    })
    .catch(() => {
      countEl.innerHTML = "결과 <strong>0</strong>건";
      grid.innerHTML = `<div class="error">보도자료데이터.json을 불러오지 못했습니다.<br>
        파일을 더블클릭해 연 경우(file://)에는 브라우저가 JSON 읽기를 막습니다. 로컬 서버나 Vercel 배포 주소로 열어 주세요.</div>`;
    });
</script>
</body>
</html>
